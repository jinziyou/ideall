name: ideall
description: A local-first personal information terminal powered by Wonita.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  dio: ^5.9.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  file_selector: ^1.0.4
  flutter_markdown_plus: ^1.0.7
  flutter_quill: ^11.5.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  go_router: ^17.0.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  share_plus: ^13.3.0

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
